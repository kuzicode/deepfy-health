# 本地开发用 Postgres：docker compose -f compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kzh
      POSTGRES_PASSWORD: kzh
      POSTGRES_DB: kzh
    ports: ["127.0.0.1:5433:5432"]
    volumes: [kzh-dev-pg:/var/lib/postgresql/data]
volumes:
  kzh-dev-pg:
